services:
  ticket:
    build: .
    image: homelab-ticket:${TASK_HUB_VERSION:-latest}
    container_name: homelab-ticket
    restart: unless-stopped
    ports:
      # Change the left-hand port if 8080 is already taken on your host.
      - "127.0.0.1:${TASK_HUB_PORT:-8080}:8080"
    volumes:
      # Named volume keeps the SQLite file across container rebuilds.
      # Swap for a bind mount (e.g. ./data:/data) if you back up by file.
      - ticket-data:/data
      - ticket-backups:/backups
    # Values come from a .env file next to this one — see .env.example.
    # The container refuses to start unless AUTH_PASSWORD is set, or you opt
    # out of authentication deliberately with AUTH_DISABLED=true.
    environment:
      TZ: ${TZ:-UTC}
      AUTH_PASSWORD: ${AUTH_PASSWORD:-}
      AUTH_DISABLED: ${AUTH_DISABLED:-}
      API_TOKEN: ${API_TOKEN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      SESSION_DAYS: ${SESSION_DAYS:-30}
      TRUST_PROXY: ${TRUST_PROXY:-}
      PUBLIC_HEALTH: ${PUBLIC_HEALTH:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      LOG_FORMAT: ${LOG_FORMAT:-}
      NOTIFY_URL: ${NOTIFY_URL:-}
      NOTIFY_FORMAT: ${NOTIFY_FORMAT:-}
      NOTIFY_EVENTS: ${NOTIFY_EVENTS:-}
      NOTIFY_MIN_PRIORITY: ${NOTIFY_MIN_PRIORITY:-}
      NOTIFY_TIMEOUT_MS: ${NOTIFY_TIMEOUT_MS:-}
      NOTIFY_REMINDER_DAYS: ${NOTIFY_REMINDER_DAYS:-}
      NOTIFY_DIGEST: ${NOTIFY_DIGEST:-}
      # Separate volume, same server: this does not protect against host loss.
      BACKUP_DIR: ${BACKUP_DIR:-/backups}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      MAINTENANCE_INTERVAL_MINUTES: ${MAINTENANCE_INTERVAL_MINUTES:-}
      WARRANTY_ALERT_DAYS: ${WARRANTY_ALERT_DAYS:-}

volumes:
  ticket-data:
  ticket-backups:
