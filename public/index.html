<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1116" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="color-scheme" content="dark light" />
    <title>Task Hub</title>
    <link rel="stylesheet" href="/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>🛠️</text></svg>"
    />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#/">
        <span class="brand-mark">▪</span>
        <span>Task Hub</span>
      </a>
      <nav class="tabs" aria-label="Task lists">
        <a href="#/" data-tab="inbox">Inbox</a>
        <a href="#/today" data-tab="today">Today</a>
        <a href="#/next" data-tab="next">Next</a>
        <a href="#/someday" data-tab="someday">Someday</a>
        <a href="#/done" data-tab="done">Done</a>
        <a href="#/all" data-tab="all">All</a>
      </nav>
      <div class="topbar-actions">
        <button class="btn btn-primary" id="new-ticket">Add task</button>
        <button class="btn btn-ghost btn-sm" id="shortcuts" title="Keyboard shortcuts (?)">?</button>
        <button class="btn btn-ghost btn-sm" id="sign-out" hidden>Sign out</button>
      </div>
    </header>

    <nav class="secondary-nav" aria-label="Tools">
      <a href="#/projects" data-tab="projects">Projects</a>
      <a href="#/waiting" data-tab="waiting">Waiting</a>
      <a href="#/snoozed" data-tab="snoozed">Snoozed</a>
      <a href="#/views" data-tab="views">Saved views</a>
      <a href="#/drafts" data-tab="drafts">Drafts</a>
      <a href="#/dashboard" data-tab="dashboard">Dashboard</a>
      <a href="#/devices" data-tab="devices">Devices</a>
      <a href="#/schedules" data-tab="schedules">Schedules</a>
    </nav>
    <nav id="saved-views-nav" class="secondary-nav saved-nav" aria-label="Saved views"></nav>

    <main id="view" aria-live="polite"></main>

    <div id="modal-root"></div>
    <div id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
